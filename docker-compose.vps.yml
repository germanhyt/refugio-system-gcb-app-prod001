services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: refugioweb-app:latest
    container_name: refugioweb_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./.env:/var/www/.env
      - storage_data:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.vps
    image: refugioweb-web:latest
    container_name: refugioweb_web
    restart: unless-stopped
    volumes:
      - storage_data:/var/www/storage:ro
    depends_on:
      - app
    networks:
      - default
      - app_shared_network

  queue:
    image: refugioweb-app:latest
    container_name: refugioweb_queue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./.env:/var/www/.env:ro
      - storage_data:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default

  db:
    image: mysql:8.0
    container_name: refugioweb_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: refugioweb_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - default

networks:
  app_shared_network:
    external: true

volumes:
  db_data:
  redis_data:
  storage_data:
